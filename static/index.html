<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CD_LAB — UB Detector</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">{ }</span>
            <div>
                <h1>CD_LAB</h1>
                <p class="tagline">AI-Assisted UB Detection in C/C++</p>
            </div>
        </div>
        <div class="status">
            <span id="health-dot" class="dot dot-unknown"></span>
            <span id="health-text">checking libclang...</span>
        </div>
    </header>

    <main class="layout">
        <section class="editor-pane">
            <div class="pane-header">
                <div class="pane-title">
                    <h2>Source</h2>
                    <select id="language">
                        <option value="cpp" selected>C++</option>
                        <option value="c">C</option>
                    </select>
                    <select id="samples-select" style="margin-left: 8px; background: #1d2230; color: #e4e6ed; border: 1px solid #4a5269; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;">
                        <option value="">-- Load Sample --</option>
                    </select>
                </div>
                <div class="pane-actions">
                    <button id="analyze-btn" class="btn primary">Analyze</button>
                </div>
            </div>

            <div id="editor"></div>
        </section>

        <section class="output-pane">
            <div class="pane-header">
                <h2>Output</h2>
                <span id="elapsed" class="muted"></span>
            </div>
            <div class="tabs">
                <button class="tab active" data-tab="diagnostics">
                    <span class="tab-label">Diagnostics</span>
                    <span class="pill pill-err"  id="pill-err"  hidden></span>
                    <span class="pill pill-warn" id="pill-warn" hidden></span>
                    <span class="pill pill-info" id="pill-info" hidden></span>
                </button>
                <button class="tab" data-tab="cfg">CFG</button>
                <button class="tab" data-tab="ast">AST</button>
                <button class="tab" data-tab="llvm">LLVM IR</button>
                <button class="tab" data-tab="errors">Parse errors</button>
                <span class="tabs-hint muted" title="Ctrl+Enter to analyze">⌘/Ctrl+↵</span>
            </div>
            <div class="tab-body">
                <div id="tab-diagnostics" class="tab-panel active">
                    <ul id="diagnostics-list"></ul>
                </div>
                <div id="tab-cfg" class="tab-panel cfg-panel">
                    <div class="cfg-toolbar">
                        <label class="muted" for="cfg-function">Function:</label>
                        <select id="cfg-function"></select>
                        <button id="cfg-fit" class="btn">Fit</button>
                    </div>
                    <div id="cfg-canvas"></div>
                </div>
                <div id="tab-ast" class="tab-panel">
                    <pre id="ast-json" class="codeblock"></pre>
                </div>
                <div id="tab-llvm" class="tab-panel llvm-panel">
                    <div class="llvm-toolbar">
                        <span class="muted">LLVM IR (read-only · -O0 · -g)</span>
                        <span id="llvm-status" class="muted"></span>
                    </div>
                    <div id="llvm-metrics-bar" class="llvm-metrics-bar" hidden></div>
                    <div id="llvm-editor"></div>
                </div>
                <div id="tab-errors" class="tab-panel">
                    <ul id="errors-list"></ul>
                </div>
            </div>
        </section>
    </main>

    <!-- Cytoscape, dagre, cytoscape-dagre are UMD modules. They MUST load
         before Monaco's AMD loader, otherwise they detect `define()` and try
         to register as anonymous AMD modules — which collide and throw
         "Can only have one anonymous define call per script file". Loading
         them first means they attach to window.cytoscape / window.dagre /
         window.cytoscapeDagre as globals. -->
    <script src="/static/vendor/cytoscape.min.js"></script>
    <script src="/static/vendor/dagre.min.js"></script>
    <script src="/static/vendor/cytoscape-dagre.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="/static/cfg.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
